; AI Buddy -- Waveshare ESP32-S3-Touch-AMOLED-1.75C (466x466 round QSPI
; AMOLED, ES8311+ES7210 codecs, AXP2101 PMIC).
; Build setup copied from ../../bark-notify/amoled, which is verified on
; this exact board (display, WiFi, mic + speaker).

[env:ai-buddy]
; Pinned: newer platform versions resolve to ESP-IDF 6.x, which split the
; "driver" component; esp_codec_dev@1.4.0 still assumes the old layout and
; fails to compile ("driver/gpio.h: No such file or directory").
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = espidf
; espressif32@6.9.0 wants tool-cmake 3.16.4, which is x86_64-only and won't
; run on this Apple Silicon Mac without Rosetta ("Bad CPU type"). 3.30.2 is
; a universal binary and builds ESP-IDF 5.3 fine.
platform_packages = tool-cmake @ ~3.30.2

monitor_speed = 115200
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

; gen_api_keys.py writes the gitignored src/api_keys.h from
; ANTHROPIC_API_KEY, DEEPGRAM_API_KEY and ELEVENLABS_API_KEY (shell env, or a
; local .env). strip_ds_store.py removes Finder .DS_Store files that would
; otherwise fail the component manager's hash check.
; Mershy's artwork (generated by art/build_assets.py), embedded in flash.
; Must match EMBED_FILES in src/CMakeLists.txt.
board_build.embed_files = src/assets/mershy.bin

extra_scripts =
    pre:scripts/gen_api_keys.py
    pre:scripts/strip_ds_store.py

; Vendor driver/codec code trips warnings. -fpermissive: esp_lcd_sh8601.h's
; SH8601_PANEL_IO_QSPI_CONFIG macro assigns an int to a gpio_num_t field,
; which is a hard error in C++ without it.
build_unflags = -Werror
build_flags =
    -Wno-error
    -Wno-type-limits
    -fpermissive
